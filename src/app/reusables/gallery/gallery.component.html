<div class="banner">
    <h1>{{galleryTitle}}</h1>
</div>

<div class="gallery">
    <div class="image-wrapper">
        <img *ngFor="let img of imageKeys; let i = index" [ngSrc]="'assets/' + images[img].src"
            [height]="images[img].height" [width]="images[img].width" (click)="toFullScreen(img)">
    </div>
</div>
