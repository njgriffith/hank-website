<div class="banner">
    <h1>{{galleryTitle}}</h1>
</div>

<div class="gallery">
    <div class="image-wrapper">
        <img *ngFor="let img of imageKeys" [ngSrc]="'assets/' + images[img].src" [width]="images[img].width"
            [height]="images[img].height" (click)="toFullScreen()">
    </div>
</div>
